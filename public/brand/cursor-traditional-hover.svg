  <line x1="12" y1="11" x2="14" y2="9" stroke="#E63946" stroke-width="1.4"/>
  
  <!-- Royal Peacock Feather Quill -->
  <path d="M15 15.5 C19.5 17, 24.5 18, 29.5 15 C27.5 21.5, 22 25, 16.5 19 L15 15.5 Z" fill="#1D3557" stroke="#FFD700" stroke-width="0.6"/>
  <ellipse cx="22.5" cy="18.5" rx="3" ry="2" fill="#0077B6" stroke="#FFE082" stroke-width="0.5" transform="rotate(-25 22.5 18.5)"/>
  <circle cx="22.5" cy="18.5" r="1.3" fill="#14224A"/>
  <circle cx="22.5" cy="18.5" r="0.6" fill="#FFD700"/>
</svg>
